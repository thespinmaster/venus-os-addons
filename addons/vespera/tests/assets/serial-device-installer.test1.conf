# shellcheck disable=SC1000-SC9999

# REQUIRED: The name of the service

DEVICE_SERVICE_NAME=
# The ve_service name used in the serial-starter-rules file
# and mapped in the serial-starter.conf file
DEVICE_SERVICE_MAPPING_NAME=

# All the values below are optional
# and are
# The tty port name used to get
DEVICE_TTY=

# The path services are copied to
SERVICE_PATH="/service"
# The path used by the serial-starter to monitor for new tty services
SERIAL_STARTER_START_SERVICE_PATH="/dev/serial-starter"
# The path to the serial-starter-rules file
SERIAL_STARTER_RULES_FILE="/home/admin/dev/projects/venus-os/addons/opkg-manager/tests/output/serial-starter.rules"
# The udev rules path that should symlink to SERIAL_STARTER_RULES_FILE
SERIAL_STARTER_RULES_FILE_SYMLINK="/home/admin/dev/projects/venus-os/addons/opkg-manager/tests/output/opkg-manager-serial-starter.rules"
# the file that contains the mapping from the ve_service to the actual service
SERIAL_STARTER_CONFIG_FILE="/etc/venus/serial-starter.conf"

# The properties to query for when creating the serrial starter rule
DEVICE_UDEV_PROPS=

#use udevadm --monitor to detect a new usb device
# otherwise uses lsusb
USE_UDEVADM_MONITOR="1"

USB_TIMEOUT=30