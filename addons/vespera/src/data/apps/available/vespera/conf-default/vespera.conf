# Shared Vespera paths used by:
#		The vespera and vespera-indexer scripts.
#		The vespera python service
# Relative paths are resolved from the Vespera app directory.
# NO BASH CODE IN HERE, including using variables aka $VESPERA_APP_DIR
# shellcheck disable=SC2034

VESPERA_APP_DIR=/data/apps/available/vespera
VESPERA_DATA_DIR=/data/var/vespera
VESPERA_FEEDS_FILE=/data/apps/available/vespera/conf/feeds-release.conf
VESPERA_FEEDS_CONF_FILE=/data/apps/available/vespera/conf/opkg.conf
VESPERA_COMBINED_CONF_FILE=/data/var/vespera/opkg.conf
VESPERA_INDEXER_STATE_FILE=/data/var/vespera/indexer.md5
VESPERA_JSON_FEEDS_FILE=/data/var/vespera/feeds.json
VESPERA_JSON_PACKAGES_FILE=/data/var/vespera/packages.json
VESPERA_VENUS_VERSION_FILE=/data/var/vespera/venus-version
VESPERA_PATCH_LIST_FILE="/data/var/vespera/patch.list"

VESPERA_INDEXER=/data/apps/available/vespera/scripts/indexer

VESPERA_LOCK_FILE="/var/lock/vespera"
VESPERA_VENUS_FIRMWARE_CHANGED_FILE="firmware-changed"
VESPERA_INSTALL_STATE_FILE="install-state"
VESPERA_APP_SERVICES_FILE="app-services"
VESPERA_APP_TEMPLATE_SERVICES_FILE="app-template-services"
VESPERA_APP_TEMPLATE_DEVICES="app-template-devices"
VESPERA_VERBOSITY_FILE="verbosity"
VESPERA_WHITEOUTS_FILE="installer-whiteouts"
VESPERA_OVERLAYS_FILE="installer-overlays"
VESPERA_LOCK_FILE="/var/lock/vespera"
VESPERA_GUI_LOCK_FILE="/var/lock/vespera-gui"
VESPERA_DBUS_NAME="dbus-name"
VESPERA_ALWAYS_START_SERVICES=false # start services even if serial starter is down (demo-mode)
